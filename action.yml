name: 'Send Notification to Telegram'
description: 'Send notification events to Telegram messenger'
author: 'chapvic'

inputs:
  chat:
    description: 'Chat ID (numeric) or @channel_name'
    required: true
  token:
    description: 'Telegram Bot Token'
    required: true
  status:
    description: 'Job status: success | failure | cancelled | info (default: info)'
    required: false
    default: 'info'
  title:
    description: 'Message title. Fallback: GITHUB_WORKFLOW name'
    required: false
  message:
    description: 'Notification message. Fallback: link to the commit'
    required: false
  footer:
    description: 'Message footer'
    required: false

runs:
  using: 'docker'
  image: 'Dockerfile'

branding:
  icon: 'send'
  color: 'blue'
